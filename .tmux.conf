# =============================================================================
# KEY BINDINGS
# =============================================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "Config file reloaded"

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind -r H resize-pane -L 5
bind -r J resize-pane -D 6
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
setw -g mode-keys vi
set-option -g allow-rename off
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

# =============================================================================
# TERMINAL / TRUECOLOR
# =============================================================================

# Prefer tmux-256color; fall back to screen-256color when its terminfo entry
# is missing (older macOS ships a terminfo db without tmux-256color).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-features ",*:RGB"

# =============================================================================
# ACTIVITY / BELL
# =============================================================================

set -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# =============================================================================
# THEME
# =============================================================================

# Panes
set -g pane-border-style fg=black

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style bg=colour234,fg=colour137
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Window status
setw -g window-status-current-style fg=colour81,bg=colour238
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style fg=colour255,bg=colour1

# Modes
setw -g clock-mode-colour colour135
setw -g mode-style fg=colour196,bg=colour238

# Messages
set -g message-style fg=colour232,bg=colour166
set -g message-command-style fg=blue,bg=black

# =============================================================================
# PLUGINS
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum (requires tmux-resurrect): autosave every 15 min, restore on start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
